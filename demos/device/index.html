<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'none'; form-action 'none'"
    />
    <title>Device Service — интерактивный каталог</title>
    <link rel="stylesheet" href="original.css" />
    <link rel="stylesheet" href="demo.css" />
    <script src="demo.js?v=3" defer></script>
  </head>
  <body>
    <main class="page">
      <header class="hero">
        <div class="hero-accent" aria-hidden="true"></div>
        <h1 class="hero-title">
          <span class="hero-l1">Каталог</span>
          <span class="hero-l2">устройств</span>
        </h1>
        <div class="hero-divider" aria-hidden="true"></div>
        <p class="hero-sub">
          Выберите снаряжение для <strong class="hero-sub-num">ПК 07</strong>
        </p>
      </header>
      <div class="filters" role="group" aria-label="Категории">
        <button data-filter="all" aria-pressed="true">Все</button>
        <button data-filter="headset" aria-pressed="false">🎧 Гарнитуры</button>
        <button data-filter="controller" aria-pressed="false">
          🎮 Контроллеры
        </button>
      </div>
      <section
        class="grid"
        id="catalog"
        aria-label="Каталог устройств"
      ></section>
      <section class="basket" aria-labelledby="basket-title">
        <h2 id="basket-title">Ваш заказ</h2>
        <p id="basket-summary" aria-live="polite">Устройства пока не выбраны</p>
        <button class="primary" id="checkout" disabled>Оформить заказ</button>
      </section>
      <section id="order" hidden aria-live="polite">
        <div class="order-icon" aria-hidden="true">✓</div>
        <h2 id="order-title">Заказ создан</h2>
      </section>
    </main>
    <dialog id="details" aria-labelledby="detail-name">
      <button class="close" type="button" aria-label="Закрыть">×</button>
      <img id="detail-image" alt="" />
      <h2 id="detail-name"></h2>
      <p id="detail-specs"></p>
    </dialog>
  </body>
</html>
